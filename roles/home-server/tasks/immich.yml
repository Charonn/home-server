---
- name: Check if Docker network exists
  tags: "immich"
  shell: docker network ls --filter name=^immich$ --format="{{ '{{.Name}}' }}"
  register: docker_network_ls
  changed_when: docker_network_ls.stdout == ""

- name: Create Docker network
  tags: "immich"
  command: docker network create immich
  when: docker_network_ls.stdout == ""

- name: Create base directory
  tags: "immich"
  file:
    path: "{{ immich_host_path }}"
    owner: deployment
    group: deployment
    mode: 0755
    state: directory

- name: Create consume directory
  tags: "immich"
  file:
    path: "{{ immich_host_path }}/upload"
    owner: 1000
    group: 1000
    mode: 0755
    state: directory

- name: Create data directory
  tags: "immich"
  file:
    path: "{{ immich_host_path }}/data"
    owner: 1000
    group: 1000
    mode: 0755
    state: directory

- name: Ensure PostgreSQL user exists
  tags: "immich"
  community.postgresql.postgresql_user:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    name: "{{ immich_db_user }}"
    password: "{{ immich_db_password }}"
    state: present

- name: Ensure Immich database exists
  tags: "immich"
  community.postgresql.postgresql_db:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    name: "{{ immich_db_name }}"
    owner: "{{ immich_db_user }}"
    state: present
    encoding: "UTF8"
    lc_collate: "C"
    lc_ctype: "C"
    template: "template0"

- name: Update apt and install pgvector in PostgreSQL container
  tags: "immich"
  community.docker.docker_container_exec:
    container: "postgres"  # Replace with your container name
    command: |
      bash -c "apt-get update && apt-get install -y postgresql-17-pgvector"

- name: Enable pgvector extension in the database
  tags: "immich"
  community.postgresql.postgresql_ext:
    name: "vector"
    db: "{{ immich_db_name }}"
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"

- name: Create earthdistance extension as postgres
  tags: "immich"
  community.postgresql.postgresql_ext:
    name: "earthdistance"
    db: "{{ immich_db_name }}"
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    state: present
    cascade: yes

- name: Create cube extension (required for earthdistance)
  tags: "immich"
  community.postgresql.postgresql_ext:
    name: "cube"
    db: "{{ immich_db_name }}"
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    state: present

- name: Create Immich server container
  tags: "immich"
  docker_container:
    name: immich_server
    image: "ghcr.io/immich-app/immich-server:{{ immich_version }}"
    volumes:
      - "{{ immich_host_path }}/upload:/usr/src/app/upload"
      - "{{ immich_host_path }}/data:/usr/src/app/data"
      - "/etc/localtime:/etc/localtime:ro"
    env: 
      DB_HOSTNAME: "{{ postgres_database_host_name }}"  # "postgres" if using container name
      DB_USERNAME: "{{ immich_db_user }}"
      DB_PASSWORD: "{{ immich_db_password }}"
      DB_DATABASE_NAME: "immich"
      DB_PORT: "5432"
      DB_VECTOR_EXTENSION: "pgvector"

      REDIS_HOSTNAME: "redis"  # Container name if in same Docker network
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "{{ redis_password }}"
      REDIS_DBINDEX: "1"  # Optional: if you want specific Redis DB

      UPLOAD_LOCATION: "/usr/src/app/upload"  # Must match container volume mount
      DATA_LOCATION: "/usr/src/app/data"     # For generated files (thumbnails, etc.)

      NODE_ENV: "production"
      IMMICH_PORT: "2283"
      IMMICH_MACHINE_LEARNING_URL: "http://immich_machine_learning:3003"

      # Optional but Recommended
      DISABLE_REVERSE_GEOCODING: "false"  # Set true if not using map features
      TYPESENSE_ENABLED: "false"          # Set true if using Typesense search
      LOG_LEVEL: "log" 
    ports:
      - "2283:2283"
    restart_policy: always
    networks:
      - name: "immich"
      - name: "postgres"
      - name: "db"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2283/api/server-info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    log_options:
      max-size: "12m"
      max-file: "5"
    log_driver: "json-file"

- name: Create Immich machine learning container
  tags: "immich"
  community.docker.docker_container:
    name: immich_machine_learning
    image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}"
    networks:
      - name: "immich"
    volumes:
      - "{{ immich_host_path }}/model-cache:/cache"
      - "{{ immich_host_path }}/data:/usr/src/app/data"
    env:
      IMMICH_MACHINE_LEARNING_PORT: "3003"  # ML container's listening port
      UPLOAD_LOCATION: "/usr/src/app/upload"  # Must match container volume mount
      DATA_LOCATION: "/usr/src/app/data"     # For generated files (thumbnails, etc.)
    restart_policy: always
    labels:
      traefik.enable: "false"
    log_options:
      max-size: "12m"
      max-file: "5"
    log_driver: "json-file"
