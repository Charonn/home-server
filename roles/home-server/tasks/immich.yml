---
- name: Check if Docker network exists
  tags: "immich"
  shell: docker network ls --filter name=^immich$ --format="{{ '{{.Name}}' }}"
  register: docker_network_ls
  changed_when: docker_network_ls.stdout == ""

- name: Create Docker network
  tags: "immich"
  command: docker network create immich
  when: docker_network_ls.stdout == ""

- name: Create required subdirectories
  ansible.builtin.file:
    path: "{{ immich_host_path }}/{{ item }}"
    owner: 1000
    group: 1000
    mode: '0755'
    state: directory
  loop:
    - immich
    - ml
    - tailscale/config
    - tailscale/state

- name: Ensure postgresql user exists
  tags: "immich"
  community.postgresql.postgresql_user:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    name: "{{ immich_db_user }}"
    password: "{{ immich_db_password }}"
    state: present

- name: Ensure Immich database exists
  tags: "immich"
  community.postgresql.postgresql_db:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    name: "{{ immich_db_name }}"
    owner: "{{ immich_db_user }}"
    state: present

- name: Grant additional permissions to immich user (including vector extension)
  tags: "immich"
  community.postgresql.postgresql_privs:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    database: "{{ immich_db_name }}"
    roles: "{{ immich_db_user }}"
    privs: "ALL"
    type: "database"
    grant_option: yes

- name: Create vector extension if needed
  tags: "immich"
  community.postgresql.postgresql_ext:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    name: "vector"
    db: "{{ immich_db_name }}"
    state: present

- name: Grant immich user read access to pg_authid (for backups)
  tags: "immich"
  community.postgresql.postgresql_privs:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    database: "postgres"  # System tables are in the postgres database
    roles: "{{ immich_db_user }}"
    privs: "SELECT"
    objs: "pg_authid"
    type: "table"
    schema: "pg_catalog"  # This is the critical change
    state: "present"

- name: Grant read access to all tables in pg_catalog
  tags: "immich"
  community.postgresql.postgresql_privs:
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    database: "postgres"
    roles: "{{ immich_db_user }}"
    privs: "SELECT"
    objs: "ALL_IN_SCHEMA"
    type: "table"
    schema: "pg_catalog"
    state: "present"

- name: Create earthdistance extension as immich
  tags: "immich"
  community.postgresql.postgresql_ext:
    name: "earthdistance"
    db: "{{ immich_db_name }}"
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    state: present
    cascade: yes

- name: Create cube extension (required for earthdistance)
  tags: "immich"
  community.postgresql.postgresql_ext:
    name: "cube"
    db: "{{ immich_db_name }}"
    login_user: "postgres"
    login_password: "{{ postgres_password }}"
    login_host: "localhost"
    login_port: "5432"
    state: present

- name: Create static Tailscale serve configuration
  ansible.builtin.copy:
    dest: "{{ immich_host_path }}/tailscale/config/immich.json"
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:80"
              }
            }
          }
        },
        "AllowFunnel": {
          "${TS_CERT_DOMAIN}:443": false
        }
      }
    mode: '0644'


- name: Deploy compose template
  ansible.builtin.template:
    src: immich/compose.yml.j2
    dest: "{{ immich_host_path }}/compose.yml"
    mode: '0644'
  notify: "Restart Docker Compose stack"
  vars:
    docker_compose_project_src: "{{ immich_host_path }}"
  register: template_result

- name: Ensure Docker Compose stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ immich_host_path }}"
    state: present
    recreate: "{{ 'always' if force_restart | default(false) else 'never' }}"
  register: compose_output
  async: 30
  poll: 5

- name: Set compose project src fact
  ansible.builtin.set_fact:
    docker_compose_project_src: "{{ immich_host_path }}"
  when: template_result.changed

