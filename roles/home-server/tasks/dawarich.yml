---
- name: Create directories for dawarich volumes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: '0770'
  loop:
    - "{{ dawarich_host_path }}/public"
    - "{{ dawarich_host_path }}/watched"
    - "{{ dawarich_host_path }}/storage"
    - "{{ dawarich_host_path }}/shared"
    - "{{ dawarich_host_path }}/tailscale/config"

# postgres (uid 999) writes into the db volume
- name: Create directories for dawarich database volume
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 999
    group: 999
    mode: '0700'
  loop:
    - "{{ dawarich_host_path }}/db"

- name: Create directories for dawarich tailscale state
  ansible.builtin.file:
    path: "{{ dawarich_host_path }}/tailscale/state"
    state: directory
    owner: 1000
    group: 1000
    mode: '0700'

- name: Create static Tailscale serve configuration
  ansible.builtin.copy:
    dest: "{{ dawarich_host_path }}/tailscale/config/config.json"
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:3000"
              }
            }
          }
        },
        "AllowFunnel": {
          "${TS_CERT_DOMAIN}:443": false
        }
      }
    mode: '0644'

- name: Deploy compose template
  # no_log: the rendered compose embeds SECRET_KEY_BASE, the DB password and the
  # tailscale authkey - a --check --diff CI run would otherwise print them to the
  # public build log.
  no_log: true
  ansible.builtin.template:
    src: dawarich/compose.yml.j2
    dest: "{{ dawarich_host_path }}/compose.yml"
    mode: '0644'
  notify: "Restart Docker Compose stack"
  vars:
    docker_compose_project_src: "{{ dawarich_host_path }}"
  register: template_result

- name: Ensure Docker Compose stack is running
  # Check-mode guard: on a host where this stack was never applied, the
  # template above writes nothing under --check, so the compose project does
  # not exist yet and this task would fail. Skip it in check mode (PR #5
  # pattern for start tasks); the real apply creates everything in order.
  when: not ansible_check_mode
  community.docker.docker_compose_v2:
    project_src: "{{ dawarich_host_path }}"
    state: present
    recreate: "{{ 'always' if force_restart | default(false) else 'never' }}"
  register: compose_output
  # First run pulls the fat freikin/dawarich ruby image (~2 GB) + postgis - give
  # it time; cached runs return in seconds.
  async: 900
  poll: 15

- name: Set compose project src fact
  ansible.builtin.set_fact:
    docker_compose_project_src: "{{ dawarich_host_path }}"
  when: template_result.changed