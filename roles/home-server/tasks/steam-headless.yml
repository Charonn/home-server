---
- name: Create directories for Steam Headless volumes
  # NOTE: owner/mode are only set on initial creation and intentionally NOT
  # enforced afterwards - the container's own services manage these
  # (X requires 1777 root:root on the X11 socket dir, pulseaudio and
  # tailscale tighten their own directories).
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - path: "{{ steam_headless_host_path }}/home"
      owner: "1000"
      group: "1000"
      mode: "0755"
    - path: "{{ steam_headless_host_path }}/sockets/.X11-unix"
    - path: "{{ steam_headless_host_path }}/sockets/pulse"
    # holds the patched start-dumb-udev.sh bind-mounted into the container
    - path: "{{ steam_headless_host_path }}/overrides"

- name: Create games directory (world-writable, as recommended upstream)
  ansible.builtin.file:
    path: "{{ steam_headless_host_path }}/games"
    state: directory
    mode: '0777'

- name: Remove obsolete .env file from the previous manual attempt
  ansible.builtin.file:
    path: "{{ steam_headless_host_path }}/.env"
    state: absent

- name: Remove obsolete socket directories from the previous manual attempt
  ansible.builtin.command: >
    rmdir --ignore-fail-on-non-empty
    {{ steam_headless_host_path }}/.X11-unix
    {{ steam_headless_host_path }}/pulse
  register: rmdir_result
  changed_when: rmdir_result.rc == 0
  # "No such file or directory" means they are already gone - that is success.
  # Real errors (e.g. directory not empty, permission denied) still fail.
  failed_when: rmdir_result.rc != 0 and
               'No such file or directory' not in rmdir_result.stderr

- name: Create Tailscale sidecar state and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ steam_headless_host_path }}/tailscale/state"
    - "{{ steam_headless_host_path }}/tailscale/config"

- name: Create static Tailscale serve configuration (noVNC web UI via MagicDNS)
  ansible.builtin.copy:
    dest: "{{ steam_headless_host_path }}/tailscale/config/config.json"
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://host.docker.internal:{{ steam_headless_novnc_port }}"
              }
            }
          }
        },
        "AllowFunnel": {
          "${TS_CERT_DOMAIN}:443": false
        }
      }
    mode: '0644'

- name: Render Tailscale sidecar env file (steam-headless-ts.env)
  # VOR dem compose-Render: der env-File-Producer muss existieren, bevor der
  # ts-steam-headless-Service den env_file-Consumer beim up/apply liest.
  # Eigenes File (nicht steam-headless.env): der Sidecar bekommt NUR den
  # Tailscale-Key, keine Steam-Stack-Secrets (least privilege).
  ansible.builtin.template:
    src: steam-headless/steam-headless-ts.env.j2
    dest: "{{ steam_headless_host_path }}/steam-headless-ts.env"
    mode: '0600'  # contains credentials
  # no_log: true ist PFLICHT hier: das Template injiziert das Vault-Secret
  # INLINE in die Render-Ausgabe - der --diff des CI (public Logs) haette es
  # sonst im Klartext gedruckt (Leak-Klasse Backup, PR #13). no_log verdeckt
  # Diff UND Fehler der Task.
  no_log: true
  # Check-Mode-Compat: im Check-Mode wird NICHTS geschrieben (kein Env-Render,
  # keine Simulation) - der Render ist Real-Run-only.
  when: not ansible_check_mode
  notify: "Restart Docker Compose stack"
  register: ts_env_render_result

- name: Set compose project src fact (ts sidecar env render)
  # Handler-Fact bei Nur-TS-Env-Change: notify-Task-vars werden NICHT geerbt
  # (PR #16-Sandbox-Befund), und das bestehende set_fact triggert nur bei
  # template_result.changed. Der Handler braucht docker_compose_project_src
  # (| mandatory), sobald IRGENDEINE notify-Quelle geaendert hat. Neues,
  # unabhaengiges set_fact statt Erweiterung der bestehenden when-Bedingung:
  # PR #16 aendert genau diese Zeile (`template_result.changed or
  # env_render_result.changed`) - ein Dritterm-Zusatz hier wuerde beim Merge
  # kollidieren. Eigene Block-Insertion = merge-neutral zu #16.
  ansible.builtin.set_fact:
    docker_compose_project_src: "{{ steam_headless_host_path }}"
  when: ts_env_render_result.changed

- name: Deploy patched start-dumb-udev.sh (prevents Xorg restart cascade - upstream issue #231)
  ansible.builtin.copy:
    src: steam-headless/start-dumb-udev.sh
    dest: "{{ steam_headless_host_path }}/overrides/start-dumb-udev.sh"
    mode: '0755'

- name: Deploy compose template
  ansible.builtin.template:
    src: steam-headless/compose.yml.j2
    dest: "{{ steam_headless_host_path }}/compose.yml"
    mode: '0600'  # secret-free now (secrets render via steam-headless*.env, no_log); 0600 kept as hardening
  notify: "Restart Docker Compose stack"
  vars:
    docker_compose_project_src: "{{ steam_headless_host_path }}"
  register: template_result

- name: Ensure Docker Compose stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ steam_headless_host_path }}"
    state: present
    recreate: "{{ 'always' if force_restart | default(false) else 'never' }}"
  register: compose_output
  # First run must pull a multi-GB image (Steam + Xfce desktop) - allow up to 1h.
  # Once the image is cached this returns in seconds.
  async: 3600
  poll: 15

- name: Set compose project src fact
  ansible.builtin.set_fact:
    docker_compose_project_src: "{{ steam_headless_host_path }}"
  when: template_result.changed

- name: Check Sunshine config exists (created on first container start)
  ansible.builtin.stat:
    path: "{{ steam_headless_host_path }}/home/.config/sunshine/sunshine.conf"
  register: sunshine_conf

- name: Allow Sunshine Web UI access from tailnet and LAN (CSRF origins)
  ansible.builtin.lineinfile:
    path: "{{ steam_headless_host_path }}/home/.config/sunshine/sunshine.conf"
    regexp: '^csrf_allowed_origins\s*=.*$'
    line: "csrf_allowed_origins = {{ (steam_headless_sunshine_csrf_origins + ['https://' ~ sunshine_lan_ip]) | join(', ') }}"
    state: present
  vars:
    sunshine_lan_ip: "{{ ansible_facts['default_ipv4']['address'] | default('localhost') }}"
  when: sunshine_conf.stat.exists
  register: sunshine_csrf

- name: Allow PIN pairing from non-localhost clients (e.g. via Tailscale)
  ansible.builtin.lineinfile:
    path: "{{ steam_headless_host_path }}/home/.config/sunshine/sunshine.conf"
    regexp: '^#?\s*origin_web_ui_allowed\s*=.*$'
    line: "origin_web_ui_allowed = wan"
    state: present
  when: sunshine_conf.stat.exists
  register: sunshine_pin

- name: Restart steam-headless container to apply the Sunshine config
  # container restart (not recreate) - the installed NVIDIA userspace
  # driver survives, only Sunshine reloads its config
  ansible.builtin.command: >
    docker compose -f {{ steam_headless_host_path }}/compose.yml restart steam-headless
  when: sunshine_csrf.changed or sunshine_pin.changed