---

- name: "Create config dir"
  file:
    path: "/home/marcel/noip"
    state: "directory"
    mode: "0775"

- name: "Copy noip config"
  become: true
  ansible.builtin.template:
    src: "files/noip.conf.j2"
    dest: "/home/marcel/noip/noip.conf"
    mode: "0775"

- name: Check if Docker network exists
  shell: docker network ls --filter name=^traefik$ --format="{{ '{{.Name}}' }}"
  register: docker_network_ls

- name: Create Docker network
  command: docker network create traefik
  when: docker_network_ls.stdout == ""

# check-mode: das docker_container-Modul hängt im check-mode-Lauf (>180 s read-timeout
# am Inspect-Pfad, reproducible im CI, unveränderlich via timeout-Param) — der
# Container-Zustand lässt sich NICHT sinnvoll im check-mode bestimmen. Der
# Docker-Inspekt-CLI-Check (check_mode: false discovery) ersetzt die Existenz-Prüfung:
- name: Check noip container exists (discovery, check-mode safe)
  shell: docker inspect noip --format '{{ '{{.State.Status}}' }}' 2>/dev/null || true
  register: noip_inspect
  check_mode: false
  changed_when: false

- name: "Run No-IP container"
  docker_container:
    name: "noip"
    image: "coppit/no-ip"
    state: "started"
    timeout: 180
    restart_policy: "unless-stopped"
    volumes:
      - "/etc/localtime:/etc/localtime"
      - "/home/marcel/noip:/config"
    log_options:
      max-size: "15m"
      max-file: "5"
    log_driver: json-file
    networks:
      - name: traefik
  when: not ansible_check_mode

