---

- name: "Restart Docker Compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_project_src | mandatory }}"  # Required variable
    state: present
    recreate: always
    remove_orphans: yes
  # async ceiling: compose-Stacks auf dem besetzten CT-102-Docker-Daemon
  # (docker-py inspect kann unter Last Minuten laufen); normale Services
  # kehren in Sekunden zurück, das Timeout begrenzt nur das Warten
  async: 1800
  poll: 15
