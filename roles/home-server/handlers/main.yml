---

- name: "Restart Docker Compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_project_src | mandatory }}"  # Required variable
    state: present
    recreate: always
    remove_orphans: yes
  # steam-headless recreations reinstall the NVIDIA userspace libs (~2 min,
  # from the cached .run) - normal services return in seconds, the timeout
  # only bounds the wait
  async: 1800
  poll: 15
