
- name: Download Vault binary
  get_url:
    url: https://releases.hashicorp.com/vault/{{ VERSION }}/vault_{{ VERSION }}_linux_amd64.zip
    dest: /tmp/vault.zip
  vars:
    VERSION: "1.17.2"

- name: Unzip Vault binary
  unarchive:
    src: /tmp/vault.zip
    dest: /usr/local/bin/
    remote_src: yes

- name: Ensure Vault is executable
  file:
    path: /usr/local/bin/vault
    mode: '0755'
