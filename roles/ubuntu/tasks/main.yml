---
- name: Add Fish shell PPA
  apt_repository:
    repo: "ppa:fish-shell/release-3"
    state: present

- name: Ensure the apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add the GPG key for the 1Password APT repository
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /tmp/1password.asc
    mode: '0644'

- name: De-armor the 1Password GPG key
  command: gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg /tmp/1password.asc
  args:
    creates: /usr/share/keyrings/1password-archive-keyring.gpg

- name: Add the 1Password APT repository
  copy:
    content: 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main'
    dest: /etc/apt/sources.list.d/1password.list

- name: Create directory for debsig policy
  file:
    path: /etc/debsig/policies/AC2D62742012EA22/
    state: directory
    mode: '0755'

- name: Add the debsig-verify policy
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
    mode: '0644'

- name: Create directory for debsig keyring
  file:
    path: /usr/share/debsig/keyrings/AC2D62742012EA22
    state: directory
    mode: '0755'

- name: Add the debsig-verify keyring
  command: gpg --dearmor -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg /tmp/1password.asc
  args:
    creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install packages with apt
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - apt-transport-https
      - bashtop
      - xdg-utils
      - wl-clipboard
      - git
      - tig
      - lsd
      - vim
      - curl
      - ca-certificates
      - htop
      - ansible
      - ansible-core
      - blueman
      - borgbackup
      - wget
      - flatpak
      - ffmpeg
      - grim
      - filezilla
      - 1password
      - fish
      - tmux
      - fzf
      - gopass
      - golang
      - httpie
      - iotop
      - imagemagick
      - jq
      - kitty
      - libfuse2
      - lnav
      - mc
      - meson
      - meld
      - mysql-client
      - mysql-common
      - mtr
      - npm
      - net-tools
      - pavucontrol
      - pwgen
      - ripgrep
      - solaar
      - software-properties-common
      - stress-ng
      - system-config-printer
      - zsh
      - unzip
      - wget
      - python3
      - python3-venv
      - python3-setuptools

- name: Uninstall Firefox Snap
  command: snap remove firefox
  ignore_errors: yes

- name: Uninstall Firefox apt
  apt:
    name: 
      - firefox
      - chromium-browser
    state: absent

- name: Remove Firefox Snap environment variables (if any)
  lineinfile:
    path: /etc/environment
    regexp: '^export FIREFOX_HOME'
    state: absent
  ignore_errors: yes

- name: Add the Flathub repository
  command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  args:
    creates: /var/lib/flatpak/repo/flathub

- name: Install applications from Flathub
  command: flatpak install -y flathub {{ item }}
  loop:
    - org.mozilla.firefox
    - org.chromium.Chromium
    - com.slack.Slack
    - io.dbeaver.DBeaverCommunity
    - md.obsidian.Obsidian
    - com.brave.Browser
    - com.visualstudio.code
    - com.getpostman.Postman
    - org.gimp.GIMP
    - org.qutebrowser.qutebrowser
    - org.keepassxc.KeePassXC
    - com.spotify.Client
    - io.github.zen_browser.zen
  args:
    creates: /var/lib/flatpak/app/{{ item }}

- name: Remove existing non-Flatpak Firefox desktop entry
  file:
    path: /usr/share/applications/firefox.desktop
    state: absent

- name: Create desktop entry for Flatpak Firefox
  copy:
    dest: /usr/share/applications/org.mozilla.firefox.desktop
    content: |
      [Desktop Entry]
      Version=1.0
      Name=Firefox
      Comment=Web Browser
      Exec=flatpak run org.mozilla.firefox
      Icon=firefox
      Terminal=false
      Type=Application
      Categories=Network;WebBrowser;

- name: Set Flatpak permissions, GTK theme, and other configurations
  shell: |
    flatpak override --user org.freedesktop.Slack --talk-name=org.freedesktop.portal.Desktop
    flatpak override --user org.freedesktop.Slack --talk-name=org.freedesktop.portal.ScreenCast
    flatpak override --user org.freedesktop.Slack --talk-name=org.freedesktop.portal.FileChooser
    flatpak override --user org.chromium.Chromium --talk-name=org.freedesktop.portal.Desktop
    flatpak override --user org.chromium.Chromium --talk-name=org.freedesktop.portal.ScreenCast
    flatpak override --user org.chromium.Chromium --talk-name=org.freedesktop.portal.FileChooser
    gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
    xdg-settings set default-web-browser org.mozilla.firefox.desktop
  become: yes
  become_user: "{{ user }}"
  ignore_errors: yes

- name: Download and install binaries
  block:
    - name: Download Vault binary
      get_url:
        url: https://releases.hashicorp.com/vault/1.17.2/vault_1.17.2_linux_amd64.zip
        dest: /tmp/vault.zip

    - name: Unzip Vault binary
      unarchive:
        src: /tmp/vault.zip
        dest: /usr/local/bin/
        remote_src: yes

    - name: Ensure Vault is executable
      file:
        path: /usr/local/bin/vault
        mode: '0755'

    - name: Download Terraform binary
      get_url:
        url: https://releases.hashicorp.com/terraform/1.4.6/terraform_1.4.6_linux_amd64.zip
        dest: /tmp/terraform.zip

    - name: Unzip Terraform binary
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin/
        remote_src: yes

    - name: Ensure Terraform binary is executable
      file:
        path: /usr/local/bin/terraform
        mode: '0755'

    - name: Download lazygit binary
      get_url:
        url: https://github.com/jesseduffield/lazygit/releases/download/v0.43.1/lazygit_0.43.1_Linux_x86_64.tar.gz
        dest: /tmp/lazygit.tar.gz

    - name: Unarchive lazygit binary
      unarchive:
        src: /tmp/lazygit.tar.gz
        dest: /usr/local/bin/
        remote_src: yes

    - name: Ensure lazygit is executable
      file:
        path: /usr/local/bin/lazygit
        mode: '0755'

- name: Install fonts
  block:
    - name: Create fonts directory
      file:
        path: ~/.local/share/fonts
        state: directory
        mode: '0755'
        owner: "{{ user }}"

    - name: Download and install Nerd Fonts
      get_url:
        url: https://github.com/ryanoasis/nerd-fonts/releases/download/v2.1.0/FiraCode.zip
        dest: /tmp/FiraCode.zip

    - name: Unzip Nerd Fonts
      unarchive:
        src: /tmp/FiraCode.zip
        dest: ~/.local/share/fonts
        remote_src: yes

    - name: Download and install JetBrains Mono
      get_url:
        url: https://github.com/JetBrains/JetBrainsMono/releases/download/v2.242/JetBrainsMono-2.242.zip
        dest: /tmp/JetBrainsMono.zip

    - name: Unzip JetBrains Mono
      unarchive:
        src: /tmp/JetBrainsMono.zip
        dest: ~/.local/share/fonts
        remote_src: yes

    - name: Refresh font cache
      command: fc-cache -fv

- name: Install Bazecor if not present
  block:
    - name: Check if Bazecor is installed 
      stat:
        path: /usr/local/bin/Bazecor
      register: bazecor_install

    - name: Download Bazecor AppImage
      get_url:
        url: https://github.com/Dygmalab/Bazecor/releases/download/v1.4.3/Bazecor-1.4.3-x64.AppImage
        dest: /tmp/Bazecor.AppImage
      when: not bazecor_install.stat.exists

    - name: Make Bazecor AppImage executable
      file:
        path: /tmp/Bazecor.AppImage
        mode: '0755'
      when: not bazecor_install.stat.exists

    - name: Move Bazecor AppImage to /usr/local/bin
      command: mv /tmp/Bazecor.AppImage /usr/local/bin/Bazecor
      when: not bazecor_install.stat.exists

    - name: Create desktop entry for Bazecor
      copy:
        dest: /usr/share/applications/bazecor.desktop
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Bazecor
          Comment=Configure Dygma keyboards
          Exec=/usr/local/bin/Bazecor
          Icon=/opt/bazecor/squashfs-root/usr/lib/bazecor/bazecor.png
          Terminal=false
          Type=Application
          Categories=Utility;
      when: not bazecor_install.stat.exists

- name: Perform system cleanup
  block:
    - name: Run apt autoremove to clean up unused packages
      apt:
        autoremove: yes

    - name: Clean up apt cache
      apt:
        autoclean: yes
