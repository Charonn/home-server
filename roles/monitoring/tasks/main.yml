---
# node_exporter NUR auf dem Proxmox-Host (systemd, eigenes binary) — Marcel-Review:
# Karte: t_6128e8c0. Marcel-Review-Stand: Host-Exporter direkt (nicht im LXC), kein Pushgateway.

  # ===================================================================
  # 1) node_exporter binary + user + systemd-unit auf dem HOST
  # ===================================================================
  - name: Create node_exporter system user
    ansible.builtin.user:
      name: "{{ monitoring_node_exporter_service_user }}"
      system: true
      shell: /usr/sbin/nologin
      home: /nonexistent
      state: present

  - name: Download + install node_exporter {{ monitoring_node_exporter_version }}
    ansible.builtin.unarchive:
      src: "{{ monitoring_node_exporter_download_url }}"
      dest: /tmp
      remote_src: true
      creates: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_node_exporter_arch }}/node_exporter"
    register: monitoring_ne_dl
    when: monitoring_node_exporter_enable | bool

  - name: Install node_exporter binary
    ansible.builtin.copy:
      src: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_node_exporter_arch }}/node_exporter"
      dest: "{{ monitoring_node_exporter_install_dir }}/node_exporter"
      mode: "0755"
      owner: root
      group: root
      remote_src: true
    notify: restart node_exporter
    when: monitoring_node_exporter_enable | bool

  - name: systemd unit node_exporter
    ansible.builtin.template:
      src: node_exporter.service.j2
      dest: /etc/systemd/system/node_exporter.service
      mode: "0644"
    notify:
      - systemd daemon-reload
      - restart node_exporter
    when: monitoring_node_exporter_enable | bool

  - name: Enable + start node_exporter (skip in check mode — Unit existiert dort noch nicht)
    ansible.builtin.systemd_service:
      name: node_exporter
      enabled: true
      state: started
    when: monitoring_node_exporter_enable | bool and not ansible_check_mode
