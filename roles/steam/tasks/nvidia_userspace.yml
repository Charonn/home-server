---
# steam role — NVIDIA userspace overlay install inside CT 110 (native).
# The CT sees the GPU via LXC device passthrough; it has no kernel module.
# Install = download the official .run, --extract-only (NEVER build the kernel
# module inside the CT), copy userspace libs + nvidia-smi, ldconfig.
# Version pinned by group_vars/all/nvidia_driver.yml (single source of truth).

- name: steam — download NVIDIA .run (userspace extract)
  ansible.builtin.get_url:
    url: "{{ nvidia_driver_base_url }}{{ nvidia_driver_run_name }}"
    dest: "/var/cache/nvidia/{{ nvidia_driver_run_name }}"
    mode: '0755'
    checksum: "sha256:{{ nvidia_driver_run_sha256 }}"
  become: true
  when: not ansible_check_mode

- name: steam — extract userspace (no kernel module build)
  ansible.builtin.command: >-
    bash /var/cache/nvidia/{{ nvidia_driver_run_name }}
    --extract-only --target /var/cache/nvidia/extract-{{ nvidia_driver_version }}
  args:
    creates: "/var/cache/nvidia/extract-{{ nvidia_driver_version }}/libnvidia-glcore.so.{{ nvidia_driver_version }}"
  become: true
  when: not ansible_check_mode

- name: steam — install userspace libs
  ansible.builtin.copy:
    src: "/var/cache/nvidia/extract-{{ nvidia_driver_version }}/{{ item }}"
    dest: "/usr/lib/x86_64-linux-gnu/"
    remote_src: true
    mode: '0755'
  become: true
  when: not ansible_check_mode
  loop:
    - "libnvidia-glcore.so.{{ nvidia_driver_version }}"
    - "libnvidia-ml.so.{{ nvidia_driver_version }}"
    - "libnvidia-glvkspirv.so.{{ nvidia_driver_version }}"
    - "libnvidia-eglcore.so.{{ nvidia_driver_version }}"
    - "libnvidia-ptxjitcompiler.so.{{ nvidia_driver_version }}"
    - "libnvidia-allocator.so.{{ nvidia_driver_version }}"
    - "libnvidia-cfg.so.{{ nvidia_driver_version }}"
    - "libnvidia-encode.so.{{ nvidia_driver_version }}"
    - "libnvidia-fbc.so.{{ nvidia_driver_version }}"
    - "libcuda.so.1"
    - "libnvidia-gtk2.so.{{ nvidia_driver_version }}"

- name: steam — install nvidia-smi + persistenced binary
  ansible.builtin.copy:
    src: "/var/cache/nvidia/extract-{{ nvidia_driver_version }}/bin/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    remote_src: true
    mode: '0755'
  become: true
  when: not ansible_check_mode
  loop: [nvidia-smi, nvidia-debugdump, nvidia-persistenced]

- name: steam — ldconfig
  ansible.builtin.command: ldconfig
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: steam — verify pinned driver version
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: steam_smi_after
  changed_when: false
  failed_when: steam_smi_after.stdout | trim != nvidia_driver_version
  when: not ansible_check_mode
