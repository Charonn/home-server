---
# steam role — CT 110 native management (ansible host = steam.shark-scylla.ts.net,
# user gamer via Tailscale SSH). Replicates the LIVE CT-110 stack: virtual X (:99,
# NVIDIA), openbox+picom compositor, steam headless, sunshine (Moonlight host),
# steam-audio. All unit/script templates mirror the verified live files 2026-10-14.
#
# DEPRECATED (out of scope of this PR): the steam-headless compose stack on
# home-server (old approach) — kept running but NOT part of this role.
#
# Check-mode: template/file tasks run (harmless writes are SKIPPED by ansible
# itself in check mode); command/systemd tasks are guarded.

# ---------------------------------------------------------------- facts
- name: steam — current stack state (read-only)
  ansible.builtin.shell: |
    echo "user=$(id gamer >/dev/null 2>&1 && echo ok || echo missing)"
    echo "smi=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1)"
  register: steam_disc
  check_mode: false
  changed_when: false

- name: steam — report
  ansible.builtin.debug:
    msg: "CT110 gamer={{ steam_disc.stdout_lines[0] | default('?') }} driver={{ steam_disc.stdout_lines[1] | default('unknown') }} target={{ steam_nvidia_driver_version }}"

# ---------------------------------------------------------------- users
- name: steam — ensure gamer/opencode exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    groups: "{{ item.groups }}"
    shell: "{{ item.shell }}"
    create_home: true
    append: true
  loop: "{{ steam_users }}"
  become: true
  when: not ansible_check_mode

# ---------------------------------------------------------------- units + scripts
- name: steam — deploy unit templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - xorg-virtual.service
    - x-compositor.service
    - steam-headless.service
    - sunshine.service
    - steam-audio.service
  become: true
  notify: steam — daemon reload

- name: steam — deploy scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: start-steam-headless.sh.j2, dest: start-steam-headless.sh, mode: '0755' }
    - { src: sunshine-setup.sh.j2, dest: sunshine-setup.sh, mode: '0755' }
    - { src: sunshine-start.sh.j2, dest: sunshine-start.sh, mode: '0755' }
    - { src: start-x-compositor.sh.j2, dest: start-x-compositor.sh, mode: '0755' }
  become: true
  notify: steam — daemon reload

- name: steam — Xorg config + EDID placeholder check
  ansible.builtin.stat:
    path: /etc/X11/edid.bin
  register: steam_edid
  check_mode: false

- name: steam — deploy xorg conf
  ansible.builtin.template:
    src: 10-nvidia-virtual.conf.j2
    dest: /etc/X11/xorg.conf.d/10-nvidia-virtual.conf
    mode: '0644'
  become: true
  notify: steam — daemon reload

# ---------------------------------------------------------------- enable
- name: steam — enable units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - xorg-virtual.service
    - x-compositor.service
    - steam-headless.service
    - sunshine.service
    - steam-audio.service
  become: true
  when: not ansible_check_mode

- name: steam — ensure services running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - xorg-virtual.service
    - x-compositor.service
    - steam-headless.service
    - sunshine.service
    # steam-audio.service: oneshot (pulse null-sink setup) — enabled above, NOT
    # 'started' here (systemd state=started würde den oneshot jede Playbook-Runde
    # triggern; die live CT-110-Basis lässt ihn von WantedBy aktivieren).
  become: true
  when: not ansible_check_mode
