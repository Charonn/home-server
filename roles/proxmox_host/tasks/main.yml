---

- name: Install required packages
  apt:
    name:
      - postfix
      - libsasl2-modules
      - mailutils
      - ca-certificates
      - powertop
    state: present
    update_cache: yes

- name: Configure Postfix main.cf
  template:
    src: postfix_main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: '0644'

- name: Configure SASL authentication
  template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: '0600'

- name: Configure SASL sender_canonical_name
  template:
    src: sender_canonical_maps.j2
    dest: /etc/postfix/sender_canonical_maps
    owner: root
    group: root

- name: Configure SASL header_check
  template:
    src: header_check.j2
    dest: /etc/postfix/header_check
    owner: root
    group: root

- name: Create SASL password database
  command: postmap /etc/postfix/sasl_passwd
  when: not ansible_check_mode

- name: Configure email aliases
  lineinfile:
    path: /etc/aliases
    line: "root: {{ mail_from_address }}"
    state: present

- name: Update new aliases database
  command: newaliases
  when: not ansible_check_mode

- name: Test email configuration
  command: echo "Test email from Proxmox" | mail -s "Proxmox Email Test" root
  when: not ansible_check_mode

- name: Create cert
  command: >
          bash -c "cat /etc/ssl/certs/ssl-cert-snakeoil.pem | sudo tee -a /etc/postfix/cacert.pam"
  become: yes

- name: restart postfix
  service:
    name: postfix
    state: restarted

- name: run newaliases
  command: newaliases
  when: not ansible_check_mode

- name: "home-server LXC provisioning"
  when: home_server_lxc_vmid is defined
  tags:
    - "home-server"
  block:
    - name: Check whether the LXC container exists
      ansible.builtin.command: "pct status {{ home_server_lxc_vmid }}"
      register: lxc_status
      failed_when: false
      changed_when: false
      check_mode: false  # read-only, safe to run in check mode

    - name: Ensure SSH public key is available for container creation
      ansible.builtin.copy:
        dest: /root/.ssh/marcel.pub
        src: "{{ playbook_dir }}/roles/common/files/marcel.pub"
        owner: root
        group: root
        mode: '0600'
      when: lxc_status.rc != 0

    - name: Ensure Debian 12 container template is available (only needed for fresh creation)
      ansible.builtin.shell: |
        pveam update >/dev/null
        if ! pveam list local 2>/dev/null | grep -q "debian-12-standard"; then
          pveam download local "$(pveam available --section system | grep -oE 'debian-12-standard_[^ ]+\.tar\.zst' | sort -V | tail -1)"
        fi
      when: lxc_status.rc != 0
      changed_when: false

    - name: Create LXC container if missing (NEVER recreated when it exists)
      ansible.builtin.shell: >-
        pct create {{ home_server_lxc_vmid }}
        local:vztmpl/$(pveam list local | grep -oE 'debian-12-standard_[^ ]+\.tar\.zst' | sort -V | tail -1)
        --hostname {{ home_server_lxc_hostname }}
        --cores {{ home_server_lxc_cores }}
        --memory {{ home_server_lxc_memory }}
        --swap {{ home_server_lxc_swap }}
        --rootfs {{ home_server_lxc_rootfs }}
        --mp0 {{ home_server_lxc_mounts[0] }}
        --mp1 {{ home_server_lxc_mounts[1] }}
        --net0 {{ home_server_lxc_net0 }}
        --features nesting=1
        --onboot 1
        --tags docker
        --ssh-keys /root/.ssh/marcel.pub
        --start 1
      when: lxc_status.rc != 0
      register: lxc_created

    - name: Bootstrap python3 inside a freshly created container (needed by Ansible)
      ansible.builtin.command: >-
        pct exec {{ home_server_lxc_vmid }} --
        bash -c "apt-get update -qq && apt-get install -y -qq python3"
      when: lxc_created is changed

    - name: Bootstrap ansible user inside a freshly created container
      ansible.builtin.shell: >-
        pct exec {{ home_server_lxc_vmid }} -- bash -c 'set -e;
        id marcel >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo,ssh-users marcel;
        install -d -m 700 -o marcel -g marcel /home/marcel/.ssh;
        cp /root/.ssh/authorized_keys /home/marcel/.ssh/authorized_keys;
        chown marcel:marcel /home/marcel/.ssh/authorized_keys;
        chmod 600 /home/marcel/.ssh/authorized_keys'
      when: lxc_created is changed
      changed_when: false

    - name: Apply GPU device passthrough config to the LXC
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ home_server_lxc_vmid }}.conf"
        line: "{{ item }}"
        state: present
      loop:
        # fuse and uinput are required by the steam-headless container
        - "lxc.mount.entry: /dev/fuse dev/fuse none bind,optional,create=file"
        - "lxc.mount.entry: /dev/uinput dev/uinput none bind,optional,create=file"
        # NVIDIA DRM nodes, via by-path symlinks so they survive GPU
        # renumbering across reboots (pci 01:00.0 = GTX 1050 Ti here).
        # Required for Sunshine kmsgrab capture and OpenGL/Vulkan.
        - "lxc.mount.entry: /dev/dri/by-path/pci-0000:01:00.0-card dev/dri/card0 none bind,optional,create=file"
        - "lxc.mount.entry: /dev/dri/by-path/pci-0000:01:00.0-render dev/dri/renderD129 none bind,optional,create=file"
        # uinput (10:223) and fuse (10:229) device nodes
        - "lxc.cgroup2.devices.allow: c 10:223 rwm"
        - "lxc.cgroup2.devices.allow: c 10:229 rwm"
        # NVIDIA device majors on this kernel: uvm=506, caps=509
        # (nvidia=195 and modeset=234 are already allowed in the base config)
        - "lxc.cgroup2.devices.allow: c 506:* rwm"
        - "lxc.cgroup2.devices.allow: c 509:* rwm"
        # /dev/input event devices for Sunshine virtual input
        - "lxc.cgroup2.devices.allow: c 13:* rwm"
        # Physical input devices (may be empty on a headless host; harmless)
        - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      register: lxc_device_config
      notify: "Restart home-server LXC"

    - name: Enable NVIDIA DRM KMS (required for Sunshine kmsgrab capture)
      # modeset is currently N on this host -> /dev/dri gives no usable KMS
      # device; takes effect on next Proxmox host reboot
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nvidia-drm-modeset.conf
        content: "options nvidia_drm modeset=1\n"
        owner: root
        group: root
        mode: '0644'
      register: nvidia_modeset_config

    - name: Rebuild initramfs after modprobe change
      ansible.builtin.command: update-initramfs -u -k all
      when: nvidia_modeset_config.changed
      changed_when: true

    - name: Load NVIDIA modules at host boot (before LXC autostart)
      # Without this, /dev/nvidia* are created lazily on first GPU access -
      # AFTER the LXC boots - and its optional bind mounts leave empty files.
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        state: present
      loop:
        - "nvidia"
        - "nvidia_drm"
      register: nvidia_modules_boot

    - name: Deploy nvidia-modeset device node service (creates /dev/nvidia-modeset at boot)
      # NvFBC (Sunshine capture) opens /dev/nvidia-modeset (c 195:254). The node
      # is created lazily by nvidia-modprobe; without it NvFBC fails and
      # Sunshine falls back to KMS. One-shot service ensures it exists early.
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia-modeset-device.service
        content: |
          [Unit]
          Description=Create NVIDIA modeset device node
          After=systemd-modules-load.service
          ConditionPathExists=!/dev/nvidia-modeset

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/nvidia-modprobe --modeset
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      register: nvidia_modeset_unit

    - name: Enable nvidia-modeset device node service
      ansible.builtin.systemd:
        name: nvidia-modeset-device.service
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if nvidia_modeset_unit.changed else 'started' }}"
      when: not ansible_check_mode

    - name: Ensure NVIDIA/DRM device nodes inside the LXC are real char devices
      # Repairs the empty regular files left by the optional bind mounts when
      # the LXC booted before the host nodes existed. No LXC restart needed.
      ansible.builtin.shell: |
        set -e
        pct status {{ home_server_lxc_vmid }} | grep -q 'status: running' || { echo "LXC not running - skipped"; exit 0; }
        for pair in "nvidia0" "nvidiactl" "nvidia-uvm" "nvidia-uvm-tools" "nvidia-modeset" "dri/card0" "dri/renderD129"; do
          host_path="/dev/${pair}"
          if [ ! -c "${host_path}" ]; then
            echo "skip ${host_path} (not a char device on host yet)"
            continue
          fi
          maj=$(stat -c '%t' "${host_path}")
          min=$(stat -c '%T' "${host_path}")
          dec_maj=$((16#${maj}))
          dec_min=$((16#${min}))
          pct exec {{ home_server_lxc_vmid }} -- bash -c "if [ ! -c /dev/${pair} ]; then rm -f /dev/${pair}; mknod /dev/${pair} c ${dec_maj} ${dec_min}; chmod 666 /dev/${pair}; fi"
        done
      args:
        executable: /bin/bash   # 16#... base-prefix arithmetic needs bash
      changed_when: false

    - name: Check effective nvidia-drm modeset on the running kernel
      # Der Modul-Param existiert NUR, wenn das nvidia-Modul geladen ist.
      # CI 2026-10-27 (fixup.md Phase 9c): nach der Host-Fixup-Reparatur war
      # der Treiber nicht geladen -> das unbedingte `cat` endete rc=1 und
      # liess den GESAMTEN Check-Run sterben, bevor die Folge-Rollen (z.B.
      # idle_power) überhaupt erreicht wurden. Fehlendes Modul = Lesesignal
      # 'not-loaded': der Warn-Task greift (!= '1'), das Reboot-Gate wird
      # nur aus einem echten 0/1-Leseergebnis entschieden.
      ansible.builtin.shell: |
        p=/sys/module/nvidia_drm/parameters/modeset
        if [ -r "$p" ]; then cat "$p"; else echo not-loaded; fi
      register: nvidia_modeset_state
      changed_when: false
      check_mode: false  # read-only, safe in check mode

    - name: Reboot the Proxmox host to activate nvidia-drm modeset (opt-in)
      # DANGER: restarts the whole Proxmox host - all guests bounce.
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - proxmox_host_reboot_on_config_change | default(false)
        - (nvidia_modeset_config.changed or (nvidia_modeset_state.stdout | trim) != '1')
        - nvidia_modeset_state.stdout | trim in ['0', '1']

    - name: Warn that the Proxmox host still needs a reboot for nvidia-drm modeset
      ansible.builtin.debug:
        msg: >-
          nvidia-drm modeset is not active yet ({{ nvidia_modeset_state.stdout | trim }}).
          Reboot the Proxmox host to apply (all guests will restart), or rerun with
          -e proxmox_host_reboot_on_config_change=true to reboot automatically.
      when:
        - not (proxmox_host_reboot_on_config_change | default(false))
        - nvidia_modeset_config.changed or (nvidia_modeset_state.stdout | trim) != '1'
