---
# home_server_gpu — manages the NVIDIA consumers on the ryzen_home_server LXC:
# the steam-headless compose stack + version alignment to the global driver pin.
#
# Driver version SOURCE OF TRUTH: group_vars/all/nvidia_driver.yml
# (nvidia_driver_version) — the compose template renders it into
# NVIDIA_DRIVER_VERSION, so the container follows every host upgrade.
# The container picks the new userspace up on recreation (its entrypoint
# re-extracts when the version differs from the image's cached install).

# ---------------------------------------------------------------- alignment
- name: home_server_gpu — discover current driver pin in live compose
  check_mode: false
  changed_when: false
  ansible.builtin.shell: >
    grep -oE 'NVIDIA_DRIVER_VERSION=[0-9.]+' /opt/steam-headless/compose.yml
    | head -1 | cut -d= -f2
  args:
    executable: /bin/bash
  register: hs_gpu_compose_pin
  failed_when: false

- name: home_server_gpu — report version alignment
  ansible.builtin.debug:
    msg: >-
      compose pin: {{ hs_gpu_compose_pin.stdout | trim | default('none') }} ->
      target {{ nvidia_driver_version }}.
      After applying, recreate the container (docker compose up -d
      --force-recreate steam-headless) so the userspace reinstall kicks in.

- name: steamhost gpu — assert required vault vars are defined
  ansible.builtin.assert:
    that:
      - steam_headless_user_password_vault is defined
      - steam_headless_sunshine_password_vault is defined
      - steam_headless_tailscale_authkey_vault is defined
    fail_msg: >-
      Missing steam_headless_*_vault vars: add them to
      group_vars/all/default.vault.yml (ansible-vault encrypt_string --name
      steam_headless_user_password_vault) before applying this play —
      see group_vars/ryzen_home_server/gpu_vault_refs.yml for the key list.
    success_msg: vault keys for steam-headless compose present.
  delegate_to: localhost
  run_once: true
  become: false

- name: home_server_gpu — ensure compose dir exists
  ansible.builtin.file:
    path: "{{ steam_headless_compose_dir }}"
    state: directory
    mode: '0755'

- name: home_server_gpu — template compose file (renders vault values)
  ansible.builtin.template:
    src: steam-headless/compose.yml.j2
    dest: "{{ steam_headless_compose_dir }}/compose.yml"
    mode: '0600'
    # 0600: the rendered file carries vault-resolved passwords and the
    # tailscale authkey — readable by root only.
  no_log: true        # never leak rendered secrets into the CI log
  notify: home_server_gpu — recreate steam-headless

# ---------------------------------------------------------------- services
# Existing services (radarr, sonarr, immich...) are NOT managed here —
# their roles stay untouched; this role only governs the steam-headless stack.

- name: home_server_gpu — ensure steam-headless stack is up (check-mode skipped)
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ steam_headless_compose_dir }}"
  when: not ansible_check_mode
  changed_when: true