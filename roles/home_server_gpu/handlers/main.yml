---
# home_server_gpu role handlers
- name: home_server_gpu — recreate steam-headless
  # forces container recreation so the NVIDIA userspace (re)installs for the
  # pinned version; downloads cached in {{ steam_headless_compose_dir }}/home/Downloads.
  ansible.builtin.shell: docker compose up -d --force-recreate steam-headless
  args:
    chdir: "{{ steam_headless_compose_dir }}"
  when: not ansible_check_mode
  changed_when: true