name: ansible-check

# Ansible: Syntax + CHECK MODE + diff über das GESAMTE site.yml (alle Rollen/Hosts).
# Kurzlebiger Tailscale-Node (tag:ci) pro Job, cleanup automatisch.
#
# Secrets (Marcel, einmalig — Settings → Secrets and variables → Actions):
#   TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_SECRET (auth_keys-Scope + tag:ci)
#   ANSIBLE_VAULT_PASS (vault-Entschlüsselung für group_vars/)
#
# Sicherheit: --check = keine Host-Writes. Ausnahme: die read-only-Discovery-Tasks
# (check_mode: false) — lesen zpool status + /sys/class/block, schreiben nichts.
# systemd/start-Tasks skippen im Check-Mode (PR #5-Muster).

on:
  pull_request:
    branches: [main]

# One run per branch at a time: a new push cancels the superseded run instead
# of queueing behind it (5-run backlog on 2026-10-16 serialized pushes ~14 min each).
concurrency:
  group: ansible-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ansible-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible
        run: pipx install ansible-core

      - name: Install galaxy requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Connect via Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          hostname: gh-ci-ansible
          tags: tag:ci

      - name: Prepare ephemeral vault password file (alle ansible-steps brauchen es)
        run: |
          cat > .vault_pass <<'VPHEADER'
          #!/usr/bin/env bash
          VPHEADER
          echo "printf '%s' '$ANSIBLE_VAULT_PASS'" >> .vault_pass
          chmod 700 .vault_pass
          bash -n .vault_pass
          test -n "$(bash .vault_pass)" && echo "vault-pass script ok (Inhalt nicht gezeigt)"
        env:
          ANSIBLE_VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASS }}

      - name: Inventory reachable? (ping, check-mode safe)
        # CI-Runner erreicht NUR die Tailnet-Hosts; LAN-only (192.168.0.x) bleiben
        # im lokalen Lauf von Marcel. Limit = beide TS-Groups (alle Rollen laufen!).
        run: |
          ansible all -m ansible.builtin.ping \
            --limit 'proxmox_ryzen,ryzen_home_server' -u marcel -b
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Syntax check (site.yml)
        run: ansible-playbook site.yml --syntax-check
        env:
          ANSIBLE_VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASS }}

      # GESAMTPLAYBOOK im Check-Mode: alle hosts / alle Rollen / alle tags.
      # --diff zeigt die Files, die ein Real-Lauf schreiben würde.
      - name: CHECK MODE + diff (vollstndige Rollen, Tailnet-Hosts)
        # 1 Retry für transiente Docker-socket-Timeouts (busy CT: docker-py inspect 60 s);
        # Retry wiederholt nur den check-Lauf — keine Writes, gleiche Sicherheit wie PR-#5-Muster.
        run: |
          ansible-playbook site.yml --check --diff \
            --limit 'proxmox_ryzen,ryzen_home_server' -u marcel -b           || (echo 'RETRY nach transientem Docker-Timeout...' && sleep 20 && \
          ansible-playbook site.yml --check --diff \
            --limit 'proxmox_ryzen,ryzen_home_server' -u marcel -b)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASS }}
        shell: bash

      # vault_pass wird nur im ephemeral runner gelesen, nie committed:
      - name: Cleanup vault password file
        if: always()
        run: rm -f .vault_pass