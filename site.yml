---

- hosts: ryzen_home_server
  become: yes
  roles:
    - role: common
    - role: "home-server"
      tags:
        - "home-server"
    - role: "backup"
      tags:
        - "backup"
    # steam-headless compose auf home-server ist DEPRECATED (Marcel, 2026-10-15):
    # die CT-110 'steam'-Baseline (roles/steam) ist der Nachfolger. Die frühere
    # home_server_gpu-Rolle + compose.yaml-Verwaltung sind hier entfernt.

- hosts: proxmox_ryzen
  become: yes
  roles:
    - role: proxmox_host
    - role: nvidia_driver
      tags:
        - "nvidia_driver"

- hosts: proxmox_ryzen
  become: yes
  roles:
    - role: idle_power
      tags:
        - "idle_power"

- hosts: steam_host
  become: yes
  roles:
    - role: steam
      tags:
        - "steam"